name: Cancel dev.19 prerelease

on:
  push:
    branches:
      - dev19-causal-route
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Remove dev.19 prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="0.2.0-dev.19"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed release and tag $TAG"
          else
            echo "Release $TAG already absent"
          fi
