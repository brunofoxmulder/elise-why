explain:
  name: Explain latest entity action
  description: Read-only causal explanation of the latest observed action for an entity.
  fields:
    entity_id:
      name: Entity
      description: Home Assistant entity_id to explain.
      required: true
      example: cover.volet_salon_2
      selector:
        entity: {}
    at_time:
      name: Observation time
      description: Optional ISO-8601 time; defaults to now.
      required: false
      example: "2026-08-22T14:00:00+00:00"
      selector:
        text: {}
